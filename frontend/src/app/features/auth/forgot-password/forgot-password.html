<div class="flex min-h-screen items-center justify-center bg-gray-800">
    <div class="w-full max-w-md rounded-lg bg-white p-8 shadow-xl">
        <div class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Forgot Password</h1>
            <p class="mt-2 text-gray-600">Enter your email to receive a reset link</p>
        </div>

        @if (successMessage) {
        <div class="mb-4 rounded bg-green-100 p-3 text-green-700">
            {{ successMessage }}
        </div>
        }

        @if (errorMessage) {
        <div class="mb-4 rounded bg-red-100 p-3 text-red-700">
            {{ errorMessage }}
        </div>
        }

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
            <div class="mb-6">
                <label for="email" class="mb-2 block text-sm font-bold text-gray-700">Email Address</label>
                <input type="email" id="email" formControlName="email"
                    class="focus:shadow-outline w-full appearance-none rounded border px-3 py-2 leading-tight text-gray-700 focus:outline-none"
                    placeholder="Enter your email" />
                @if (forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid) {
                <p class="mt-1 text-xs text-red-500">Please enter a valid email address.</p>
                }
            </div>

            <div class="flex items-center justify-between">
                <button type="submit" [disabled]="forgotPasswordForm.invalid || isSubmitting"
                    class="focus:shadow-outline rounded bg-blue-600 px-4 py-2 font-bold text-white hover:bg-blue-700 focus:outline-none disabled:opacity-50">
                    {{ isSubmitting ? 'Sending...' : 'Send Reset Link' }}
                </button>
                <a routerLink="/login" class="align-baseline text-sm font-bold text-blue-600 hover:text-blue-800">
                    Back to Login
                </a>
            </div>
        </form>
    </div>
</div>
