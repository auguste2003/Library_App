<div class="flex min-h-screen items-center justify-center bg-gray-100">
  <div class="w-full max-w-md rounded-lg bg-white p-8 shadow-md">
    <h2 class="mb-6 text-center text-2xl font-bold text-gray-800">Sign In</h2>

    @if (errorMessage) {
    <div class="mb-4 rounded bg-red-100 p-3 text-red-700">
      {{ errorMessage }}
    </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label for="email" class="mb-2 block text-sm font-bold text-gray-700">Email</label>
        <input type="email" id="email" formControlName="email"
          class="focus:shadow-outline w-full appearance-none rounded border px-3 py-2 leading-tight text-gray-700 focus:outline-none"
          placeholder="Email Address" />
        @if (loginForm.get('email')?.touched && loginForm.get('email')?.invalid) {
        <p class="mt-1 text-xs text-red-500">Valid email is required.</p>
        }
      </div>

      <div class="mb-6">
        <label for="password" class="mb-2 block text-sm font-bold text-gray-700">Password</label>
        <input type="password" id="password" formControlName="password"
          class="focus:shadow-outline w-full appearance-none rounded border px-3 py-2 leading-tight text-gray-700 focus:outline-none"
          placeholder="Password" />
        @if (loginForm.get('password')?.touched && loginForm.get('password')?.invalid) {
        <p class="mt-1 text-xs text-red-500">Password is required.</p>
        }
      </div>

      <div class="mb-2 text-right">
        <a routerLink="/forgot-password" class="text-sm text-blue-500 hover:text-blue-800">
          Forgot Password?
        </a>
      </div>

      <div class="flex items-center justify-between">
        <button type="submit" [disabled]="loginForm.invalid"
          class="focus:shadow-outline rounded bg-blue-500 px-4 py-2 font-bold text-white hover:bg-blue-700 focus:outline-none disabled:opacity-50">
          Sign In
        </button>
        <a routerLink="/register"
          class="inline-block align-baseline text-sm font-bold text-blue-500 hover:text-blue-800">
          Register
        </a>
      </div>
    </form>
  </div>
</div>
