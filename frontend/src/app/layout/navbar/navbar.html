<nav class="bg-gray-800 p-4 shadow-md">
    <div class="container mx-auto flex items-center justify-between">
        <a routerLink="/" class="text-xl font-bold text-white hover:text-gray-300">
            📚 Library App
        </a>

        <div class="flex items-center space-x-4">
            <!-- Public Links -->
            <a routerLink="/books" routerLinkActive="text-blue-400" [routerLinkActiveOptions]="{exact: true}"
                class="text-gray-300 hover:text-white transition-colors">
                Books
            </a>

            @if (authService.isAuthenticated) {
            <!-- User Links -->
            <span class="text-gray-500 hidden md:inline">
                Hello, {{ authService.currentUser()?.sub }}!
            </span>
            <button (click)="logout()"
                class="rounded bg-red-600 px-3 py-1 text-sm font-bold text-white hover:bg-red-700 transition-colors">
                Logout
            </button>
            } @else {
            <!-- Guest Links -->
            <a routerLink="/login" routerLinkActive="text-blue-400"
                class="text-gray-300 hover:text-white transition-colors">
                Login
            </a>
            <a routerLink="/register" routerLinkActive="text-blue-400"
                class="rounded bg-blue-600 px-3 py-1 text-sm font-bold text-white hover:bg-blue-700 transition-colors">
                Sign Up
            </a>
            }
        </div>
    </div>
</nav>
