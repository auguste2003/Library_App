<div *ngIf="isOpen()"
    class="fixed inset-0 z-[100] flex items-center justify-center overflow-y-auto overflow-x-hidden bg-black/50 p-4 transition-all backdrop-blur-sm"
    (click)="close()">
    <!-- Modal content -->
    <div class="relative w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl ring-1 ring-gray-200 transform transition-all scale-100"
        (click)="$event.stopPropagation()">

        <!-- Icon -->
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full"
            [ngClass]="type() === 'success' ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'">
            @if (type() === 'success') {
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            } @else {
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            }
        </div>

        <!-- Title -->
        <h3 class="mb-2 text-center text-xl font-bold text-gray-900">
            {{ title() }}
        </h3>

        <!-- Message -->
        <p class="mb-6 text-center text-gray-500">
            {{ message() }}
        </p>

        <!-- Buttons -->
        <div class="flex justify-center gap-4">
            @if (showCancel()) {
            <button (click)="close()"
                class="w-full rounded-xl border border-gray-300 bg-white px-5 py-3 font-semibold text-gray-700 transition-colors duration-200 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-200 focus:ring-offset-2">
                Cancel
            </button>
            <button (click)="confirm()"
                class="w-full rounded-xl px-5 py-3 font-semibold text-white transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2"
                [ngClass]="type() === 'success' ? 'bg-green-600 hover:bg-green-700 focus:ring-green-500' : 'bg-red-600 hover:bg-red-700 focus:ring-red-500'">
                Confirm
            </button>
            } @else {
            <button (click)="close()"
                class="w-full rounded-xl px-5 py-3 font-semibold text-white transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2"
                [ngClass]="type() === 'success' ? 'bg-green-600 hover:bg-green-700 focus:ring-green-500' : 'bg-red-600 hover:bg-red-700 focus:ring-red-500'">
                Close
            </button>
            }
        </div>
    </div>
</div>
