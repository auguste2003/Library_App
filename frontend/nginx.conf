server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the gateway if needed (optional here if we use full URLs in env, but good practice to have)
    # But since this is just serving static files, we rely on the frontend environment variables to point to the API.
    # So this simple config is enough for SPA.
}
